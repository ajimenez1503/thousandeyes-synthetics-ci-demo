stages:
  - test

thousandeyes:
  stage: test
  timeout: 10m
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: false
  script:
    - |
      set +x
      set -eu
      mkdir -p reports
      rm -f reports/results.json reports/results.xml
      thousandeyes synthetics run-tests \
        --config thousandeyes-ci.json \
        --account-group-id "$TE_ACCOUNT_GROUP_ID" \
        --json-report reports/results.json \
        --junit-report reports/results.xml
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/results.json
      - reports/results.xml
