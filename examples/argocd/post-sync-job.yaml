apiVersion: batch/v1
kind: Job
metadata:
  name: thousandeyes-synthetics
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 360
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: synthetics
          image: your-registry/thousandeyes-cli:0.0.2-next
          args:
            - synthetics
            - run-tests
            - --config
            - /config/thousandeyes-ci.json
            - --account-group-id
            - "$(TE_ACCOUNT_GROUP_ID)"
            - --timeout
            - 5m
            - --json
          env:
            - name: TE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: thousandeyes-api
                  key: TE_TOKEN
            - name: TE_ACCOUNT_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: thousandeyes-suite
                  key: account-group-id
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: thousandeyes-suite
            items:
              - key: thousandeyes-ci.json
                path: thousandeyes-ci.json
