name: ThousandEyes synthetic CI demo
on:
  workflow_dispatch:
    inputs:
      account-group-id:
        description: Account group ID (blank uses the repository default)
        type: string
      agent-ids:
        description: 1 to 5 comma-separated agent IDs (blank uses the repository default)
        type: string
      target-url:
        description: HTTPS target URL (blank uses the repository default)
        type: string
      expected-http-status:
        description: Expected HTTP status (blank uses the repository default or 200)
        type: string
      network-host:
        description: Optional DNS hostname or IP without a port (defaults to URL hostname)
        type: string
      network-port:
        description: TCP port (blank uses the repository default or 443)
        type: string
      api-base-url:
        description: Choose the ThousandEyes API matching your token
        type: choice
        options:
          - https://api.thousandeyes.com
          - https://api.stg.thousandeyes.com
        default: https://api.thousandeyes.com
      scenario:
        description: Select passing checks or a deliberately incorrect HTTP expectation
        type: choice
        options: [healthy, blocking-failure, non-blocking-failure]
        default: healthy
permissions:
  contents: read
jobs:
  live:
    name: Real ThousandEyes HTTP and TCP checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate suite generator
        run: npm test
      - name: Check secret and generate suite from validated inputs
        run: |
          node -e "if (!process.env.TE_TOKEN) { console.error('Add the TE_TOKEN repository secret before running.'); process.exit(1); }"
          node scripts/create-live-suite.js
        env:
          TE_TOKEN: ${{ secrets.TE_TOKEN }}
          DEMO_ACCOUNT_GROUP_ID: ${{ inputs.account-group-id || vars.TE_ACCOUNT_GROUP_ID }}
          DEMO_AGENT_IDS: ${{ inputs.agent-ids || vars.TE_AGENT_IDS }}
          DEMO_TARGET_URL: ${{ inputs.target-url || vars.TE_TARGET_URL }}
          DEMO_EXPECTED_HTTP_STATUS: ${{ inputs.expected-http-status || vars.TE_EXPECTED_HTTP_STATUS || '200' }}
          DEMO_NETWORK_HOST: ${{ inputs.network-host || vars.TE_NETWORK_HOST }}
          DEMO_NETWORK_PORT: ${{ inputs.network-port || vars.TE_NETWORK_PORT || '443' }}
          DEMO_API_BASE_URL: ${{ inputs.api-base-url }}
          DEMO_SCENARIO: ${{ inputs.scenario }}
      - name: Run real HTTP and TCP checks
        id: synthetics
        uses: ajimenez1503/thousandeyes-synthetics-ci-github-action@1d59d4d82e07e1015e553995a4ecd820938915f2
        with:
          api-token: ${{ secrets.TE_TOKEN }}
          config-path: .demo/live.json
          api-base-url: ${{ inputs.api-base-url }}
      - name: Downloadable JSON and JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-synthetic-reports
          path: |
            ${{ steps.synthetics.outputs.json-report }}
            ${{ steps.synthetics.outputs.junit-report }}
          if-no-files-found: warn
          retention-days: 7
