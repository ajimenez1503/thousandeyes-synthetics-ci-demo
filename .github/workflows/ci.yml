name: ThousandEyes checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run ThousandEyes checks
        id: synthetics
        uses: ajimenez1503/thousandeyes-synthetics-ci-github-action@4b82978533eb58d168be2a148f4bcf0290c0a652
        with:
          api-token: ${{ secrets.TE_TOKEN }}
          account-group-id: ${{ vars.TE_ACCOUNT_GROUP_ID }}
          config-path: thousandeyes-ci.json
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: thousandeyes-results
          path: |
            ${{ steps.synthetics.outputs.json-report }}
            ${{ steps.synthetics.outputs.junit-report }}
          if-no-files-found: warn
          retention-days: 7
